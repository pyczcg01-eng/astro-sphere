<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 定义一个极具吸引力的蓝色到紫色的渐变 -->
    <linearGradient id="astroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <!-- 重要：定义符号 ID 为 "brand"，供 Header 组件调用 -->
    <symbol id="brand" viewBox="0 0 100 100">
      <!-- 1. 背景环形（淡色） -->
      <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="2" fill="none" opacity="0.1" class="dark:text-white text-black"/>
      
      <!-- 2. 主体渐变环形（象征无限与宇宙） -->
      <path d="M50 10 A40 40 0 1 1 49.9 10" stroke="url(#astroGradient)" stroke-width="6" fill="none" stroke-linecap="round">
         <animateTransform 
            attributeName="transform" 
            attributeType="XML" 
            type="rotate" 
            from="0 50 50" 
            to="360 50 50" 
            dur="10s" 
            repeatCount="indefinite"/>
      </path>

      <!-- 3. 上升的星形箭头（象征探索与光芒） -->
      <path d="M50 30 L60 55 L85 60 L65 75 L70 100 L50 85 L30 100 L35 75 L15 60 L40 55 Z" fill="url(#astroGradient)">
         <animateTransform 
            attributeName="transform" 
            attributeType="XML" 
            type="translate" 
            values="0 0; 0 -5; 0 0" 
            dur="3s" 
            repeatCount="indefinite"/>
      </path>
    </symbol>
  </defs>
  
  <!-- 在 SVG 根部直接预览（可选，不影响 use 调用） -->
  <use href="#brand" x="0" y="0" width="100" height="100"/>
</svg>

